name: Build ARM Binary

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ARMv7
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: setup-buildx

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nuitka build cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: cache-nuitka
          key: nuitka-cache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            nuitka-cache-${{ runner.arch }}-
            nuitka-cache-

      - name: Restore and save Nuitka build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: cache-nuitka
          key: nuitka-cache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            nuitka-cache-${{ runner.arch }}-
            nuitka-cache-

      - name: Inject buildkit cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: cache-nuitka
          dockerfile: .github/Dockerfile.arm
          skip-extraction: ${{ github.ref != 'refs/heads/main' }}

      - name: Stamp build SHA
        id: stamp
        env:
          FULL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHA=$(git rev-parse --short "$FULL_SHA")
          echo "$SHA" > kindle_hid_passthrough/BUILD_SHA
          sed -i "s/^__build_sha__ = None/__build_sha__ = \"${SHA}\"/" kindle_hid_passthrough/config.py
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build ARMv7 binary with Docker
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: .github/Dockerfile.arm
          platforms: linux/arm/v7
          tags: kindle-hid-passthrough-builder
          load: true
          cache-from: type=registry,ref=ghcr.io/zampierilucas/kindle-hid-passthrough-buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=registry,ref=ghcr.io/zampierilucas/kindle-hid-passthrough-buildcache,mode=max' || '' }}

      - name: Extract binaries
        run: |
          CONTAINER_ID=$(docker create kindle-hid-passthrough-builder)
          mkdir -p output/dist

          # Extract C wrapper and syscall shim
          docker cp "$CONTAINER_ID:/build/kindle-hid-passthrough" ./output/kindle-hid-passthrough
          docker cp "$CONTAINER_ID:/build/libsyscall_wrapper.so" ./output/libsyscall_wrapper.so

          # Extract entire Nuitka standalone dist directory (includes ld-linux + all .so deps)
          docker cp "$CONTAINER_ID:/build/nuitka-out/main.dist/." ./output/dist/

          # Extract the mouse cursor overlay binary (old-glibc build)
          mkdir -p output/scripts
          docker cp "$CONTAINER_ID:/build/mousecursor" ./output/scripts/mousecursor

          docker rm "$CONTAINER_ID"
          chmod +x output/kindle-hid-passthrough output/dist/main.bin output/dist/ld-linux-armhf.so.3 output/scripts/mousecursor

      - name: Add scripts and assets
        run: |
          cp -r scripts/ output/
          cp -r assets/ output/
          cp -r illusion/ output/
          cp -r koreader-plugin/ output/
          cp kindle_hid_passthrough/config.ini output/

      # Tracks the latest mapper release, so a mapper fix reaches this tarball
      # without a commit here.
      - name: Bundle kindle-button-mapper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output/button-mapper
          KBM_VERSION=$(gh release view \
            --repo zampierilucas/kindle-button-mapper-rs \
            --json tagName --jq .tagName)
          echo "Bundling kindle-button-mapper $KBM_VERSION"
          gh release download "$KBM_VERSION" \
            --repo zampierilucas/kindle-button-mapper-rs \
            --pattern 'kindle-button-mapper-armv7.tar.gz' \
            --output /tmp/kbm.tar.gz
          tar -xzf /tmp/kbm.tar.gz -C output/button-mapper
          echo "$KBM_VERSION" > output/button-mapper/VERSION
          chmod +x output/button-mapper/kindle-button-mapper \
                   output/button-mapper/install.sh \
                   output/button-mapper/uninstall.sh

      - name: Show contents
        run: |
          echo "=== Top level ==="
          ls -lh output/
          echo "=== dist/ ==="
          ls -lh output/dist/ | head -30
          echo "=== File types ==="
          file output/kindle-hid-passthrough output/dist/main.bin output/dist/ld-linux-armhf.so.3

      - name: Create tarball
        run: |
          tar -cJvf "kindle-hid-passthrough-armv7.tar.xz" -C output .
          ls -lh *.tar.xz

      - name: Validate KindleForge install compatibility
        run: |
          echo "Checking tarball contains all files expected by KindleForge install.sh..."
          MISSING=0
          for f in \
            kindle-hid-passthrough \
            assets/hid-passthrough.upstart \
            assets/99-hid-keyboard.rules \
            assets/audio-hack/start_audio_hack.sh \
            assets/audio-hack/stop_audio_hack.sh \
            assets/audio-hack/gst-launch-wrapper.sh \
            assets/audio-hack/lipc_audio_mock.lua \
            assets/audio-hack/media.sh \
            scripts/dev_is_keyboard.sh \
            illusion/BTManager.sh \
            koreader-plugin/hidpassthrough.koplugin/main.lua \
            koreader-plugin/hidpassthrough.koplugin/_meta.lua \
            koreader-plugin/hidpassthrough.koplugin/event_map_extra.lua \
            config.ini \
            dist/main.bin \
            dist/libsbc.so.1 \
            button-mapper/kindle-button-mapper \
            button-mapper/install.sh \
            button-mapper/config.ini; do
            if ! tar -tJf kindle-hid-passthrough-armv7.tar.xz "./$f" >/dev/null 2>&1; then
              echo "MISSING: $f"
              MISSING=1
            else
              echo "OK: $f"
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Tarball is missing files required by KindleForge install script"
            exit 1
          fi
          echo "All required files present."

      - name: Create KPM package
        run: |
          python3 scripts/gen_kpm_manifests.py
          # Stale index means KPM never offers the upgrade.
          git diff --exit-code kpm/repo.json
          cp kpm/manifest.json kpm/install.sh kpm/uninstall.sh output/
          # KPM only finds manifest.json at the archive root, so no ./ prefix.
          tar -cJf "kindle-hid-passthrough.kpkg" -C output $(ls -A output)
          tar -tJf kindle-hid-passthrough.kpkg | grep -qx manifest.json
          ls -lh kindle-hid-passthrough.kpkg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kindle-hid-passthrough-armv7
          path: kindle-hid-passthrough-armv7.tar.xz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            kindle-hid-passthrough-armv7.tar.xz
            kindle-hid-passthrough.kpkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dev prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-${{ steps.stamp.outputs.sha }}
          name: Dev build ${{ steps.stamp.outputs.sha }}
          files: |
            kindle-hid-passthrough-armv7.tar.xz
            kindle-hid-passthrough.kpkg
          prerelease: true
          make_latest: "false"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
