name: Build ARM Binary

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARMv7 binary with Docker
        run: |
          docker build \
            --platform linux/arm/v7 \
            -f Dockerfile.arm \
            -t kindle-hid-passthrough-builder \
            --load \
            .

      - name: Extract artifacts
        run: |
          CONTAINER_ID=$(docker create kindle-hid-passthrough-builder)
          docker cp "$CONTAINER_ID:/build/dist/." ./dist/
          docker rm "$CONTAINER_ID"

      - name: Show artifact info
        run: |
          echo "=== Binary info ==="
          file dist/kindle-hid-passthrough
          ls -lh dist/kindle-hid-passthrough
          echo ""
          echo "=== Size ==="
          du -sh dist/kindle-hid-passthrough

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kindle-hid-passthrough-armv7
          path: dist/kindle-hid-passthrough

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/kindle-hid-passthrough
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
