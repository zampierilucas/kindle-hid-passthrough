# BLE/Classic HID Host Configuration

[paths]
cache_dir = /mnt/us/kindle_hid_passthrough/cache
devices_config = /mnt/us/kindle_hid_passthrough/devices.conf

[connection]
reconnect_delay = 5
hci_reset_timeout = 10
connect_timeout = 30
transport_timeout = 30

[power]
# Monitor Kindle powerd events and release Bluetooth before suspend.
monitor_enabled = true
# Let stock WMT/Wi-Fi services settle before opening /dev/stpbt.
startup_delay = 8
resume_delay = 20

[transport]
# hci_transport = file:/dev/stpbt

[device]
name = Kindle-HID
address = F0:F0:F0:F0:F0:F0

[protocol]
# Default protocol: ble or classic
type = classic

[classic]
# Require a live SDP HID descriptor before creating a Kindle input device.
# This prevents phones with remembered bonds from appearing as keyboards when
# their HID app is not actually running.
require_live_descriptor = true

[logging]
log_file = /var/log/hid_passthrough.log
