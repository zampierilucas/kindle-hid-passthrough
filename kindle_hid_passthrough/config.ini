# BLE/Classic HID Host Configuration

[paths]
cache_dir = /mnt/us/kindle_hid_passthrough/cache
devices_config = /mnt/us/kindle_hid_passthrough/devices.conf

[connection]
reconnect_delay = 5
hci_reset_timeout = 10
connect_timeout = 30
transport_timeout = 30

[transport]
# hci_transport = file:/dev/stpbt

[device]
# name defaults to the detected model (e.g. "Kindle Basic 4"); set to override
# name = Kindle-HID
address = F0:F0:F0:F0:F0:F0

[protocol]
# Default protocol: ble or classic
type = classic

[media_remote]
# Phone volume keys turn pages; pair via the Pair Phone button in BTManager
enabled = true

# Sent to a device once it connects, and again on every reconnect. Use it for
# indicator lights, rumble or mode switches the controller only settles on
# when a host asks. One hex report per address, report id first, overriding
# anything built in. Joy-Con and Pro Controller are handled without
# configuration, including the Lights toggle in BTManager.
# [output_reports]
# 98:B9:EA:01:67:68 = 010000014040000140403001

[logging]
log_file = /var/log/hid_passthrough.log
